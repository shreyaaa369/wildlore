:root{--green:#19734e;--ink:#20372c;--muted:#77837b;--line:#e3e9e2}*{box-sizing:border-box}body{margin:0;background:#f7f9f5;color:var(--ink);font:15px system-ui,"Microsoft YaHei",sans-serif}button,input,a{font:inherit}a{color:inherit;text-decoration:none}button{cursor:pointer}header{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(5vw,20px)}.brand{display:flex;align-items:center;gap:12px;font-weight:750;letter-spacing:1px}.mark{display:grid;place-items:center;background:#eaf3e9;border-radius:12px;width:42px;height:42px;color:var(--green);font-size:25px}.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:2px;margin-top:4px}nav{display:flex;gap:25px;font-size:13px}nav a:first-child{color:var(--green);font-weight:700}main{max-width:1040px;margin:32px auto;padding:0 24px}.hero{text-align:center;padding:38px 20px 30px;border:1px solid #e1e9dd;border-radius:22px;background:linear-gradient(120deg,#edf4e8,#f4f7ef 65%,#e7f0e5);position:relative;overflow:hidden}.eyebrow{font-size:11px;letter-spacing:3px;color:#63866a}h1{font-size:clamp(24px,4vw,34px);margin:13px 0;letter-spacing:1px}.intro{color:#6a7e6c;font-size:14px;line-height:1.8;margin:0}.search{display:flex;max-width:530px;margin:24px auto 10px;padding:5px;background:#fff;border:1px solid #dce6d8;border-radius:12px;box-shadow:0 5px 20px #32552806}.search input{min-width:0;flex:1;border:0;background:none;padding:10px;outline:none}.search button{border:0;background:var(--green);color:#fff;border-radius:8px;padding:10px 22px}.hint{font-size:11px;color:#7b8c7a}.section-title{display:flex;justify-content:space-between;align-items:center;margin:28px 0 14px}.section-title h2{font-size:16px;margin:0}.section-title span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{display:flex;align-items:center;gap:20px;border:1px solid var(--line);border-radius:16px;background:# body{min-height:100dvh;display:flex;flex-direction:column;padding-bottom:78px}main{width:100%;flex:1}.mark{width:58px;height:58px;border-radius:50%;overflow:hidden;border:1px solid #d6deca;background:#f4edd9;box-shadow:0 2px 8px #354f2212;flex-shrink:0}.mark img{width:100%;height:100%;object-fit:cover;display:block}.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:800;background:#fffffff5;border-top:1px solid #dce5d8;backdrop-filter:blur(14px);display:flex;justify-content:center;gap:12px;padding:10px 18px max(10px,env(safe-area-inset-bottom));height:auto}.bottom-nav a{min-width:130px;display:flex;align-items:center;justify-content:center;gap:9px;border-radius:11px;padding:11px 22px;color:#738273;font-size:13px}.bottom-nav a:hover{background:#f1f6ed;color:#19734e}.bottom-nav a[aria-current="page"]{background:#eaf2e5;color:#21613f;font-weight:700}.bottom-nav svg{width:21px;height:23px}.page-heading{padding:28px 0 20px}.page-heading h1{margin-top:8px}.page-heading p{color:#77837b;font-size:14px;line-height:1.8}.back{color:#19734e;font-size:13px}.empty-section{background:white;border:1px solid #e3e9e2;border-radius:16px;padding:24px}.empty-section h2{font-size:17px;margin:0 0 12px}.empty-section p{font-size:13px;color:#77837b;line-height:1.8}.page-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.empty-note{border:1px dashed #cddbc8;border-radius:10px;background:#f7faf5;padding:24px 15px;text-align:center;color:#84907e;font-size:13px}.status-tag{display:inline-block;padding:5px 10px;border-radius:20px;background:#eef3e8;color:#6c805d;font-size:11px}footer{padding-bottom:24px}@media(max-width:650px){.mark{width:45px;height:45px}.brand{gap:8px;font-size:13px;letter-spacing:0}.brand small{font-size:7px;letter-spacing:1px}.bottom-nav{gap:4px;padding:8px 10px max(8px,env(safe-area-inset-bottom))}.bottom-nav a{min-width:0;flex:1;padding:10px 5px;font-size:12px;gap:6px}.page-grid{grid-template-columns:1fr}.page-heading{padding-top:15px}}

.mark{background:#f3f8ef;border-color:#dce8d6;box-shadow:0 2px 8px #354f2208} .filters{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.filters input,.filters select{padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);max-width:100%}.filters input{flex:1;min-width:150px}.resource-list,.course-list{display:grid;gap:15px;margin-top:20px}.resource-item,.course-item{padding:22px;border:1px solid var(--line);border-radius:15px;background:#fff;overflow-wrap:anywhere}.resource-item h2,.course-item h2{font-size:18px;margin:0 0 10px}.resource-item p,.course-item p,.resource-item dd,.resource-item dt{font-size:13px;line-height:1.9}.resource-item p,.course-item p{color:#6f7d72}.resource-item summary{cursor:pointer;color:#19734e;font-size:13px}.resource-item dd{margin:0 0 10px;white-space:pre-wrap}.resource-item dt{color:#6f7d72}.map-link{display:inline-block;padding:9px 13px;border-radius:8px;background:#eaf2e5;color:#21613f;font-size:13px;margin-top:10px}.source-note{font-size:12px;line-height:1.9;color:#77837b}.course-item ul{padding-left:20px;font-size:13px;line-height:1.9}.resource-overview button{border:1px solid #dfe9df;background:#fff;border-radius:13px;padding:14px;display:flex;gap:8px;align-items:center;text-align:left;color:var(--ink)}.resource-overview button[aria-pressed="true"]{border-color:#19734e;background:#edf5e8} .resource-overview button small{margin-left:auto}.resource-overview button i{width:13px;height:13px;border-radius:50%;flex-shrink:0}
.activity-link{color:#226b47;text-decoration:underline;text-decoration-color:#b6cfa8;text-underline-offset:3px;line-height:2.2}.resource-item{scroll-margin-top:20px}</style></head><body><header><a class="brand" href="index.html"><span class="mark"><img src="assets/jinyun-zhiye-logo-light.png" alt="缙云知野自然花境标志"></span><span>缙云知野自然图谱<small>JINYUN ZHIYE · NATURE ATLAS</small></span></a><nav><a href="index.html">首页</a><a href="resource-map.html">资源地图</a></nav></header><main><a class="back" href="index.html">← 返回首页</a><div class="page-heading"><h1>资源图鉴</h1><p>按类别查找资源，查看原始档案及其记录的教育主题。</p></div><form class="filters" id="filters"><input id="resourceSearch" aria-label="搜索资源图鉴" placeholder="搜索名称、编号、教育主题或区域"><select id="category" aria-label="资源类别"><option value="">全部类别</option></select><button class="btn" type="reset">清除筛选</button></form><div class="section-title"><h2>资源分类概览</h2><span id="total"></span></div><div class="resource-overview" id="resourceOverview"></div><p class="source-note">以下分类沿用现有网站规则，档案内容与教育主题按已有数据展示；主题关联不代表已验证的因果关系或完整生态关系网络。</p><p id="resultCount" role="status"></p><div class="resource-list" id="resourceList"></div></main><footer>缙云山自然教育资源数字图谱 · 在观察中认识自然，在探索中学会守护</footer><nav class="bottom-nav" aria-label="底部分页导航"><a href="index.html"><svg viewBox="0 0 26 28" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 11 9-8 9 8v11H5V11m5 11v-8h5v8"/></svg>首页</a><a href="my.html"><svg viewBox="0 0 26 28" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 23c0-10 16-10 16 0"/></svg>我的</a></nav><script src="resource-points.js"></script><script src="curated-resources.js"></script><script src="nature-courses.js"></script><script src="course-teaching.js"></script><script src="activity-guide.js"></script><script>const records=window.JINYUN_RESOURCE_POINTS||[];const majorOf=window.jinyunMajorCategory;const majors=window.JINYUN_RESOURCE_MAJOR||{};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const mapUrl=r=>'resource-map.html?v=resource-v4&id='+encodeURIComponent(r.id);
const select=document.querySelector('#category');Object.keys(majors).forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;select.append(o)});
document.querySelector('#total').textContent='已收录 '+records.length+' 项资源';
Object.entries(majors).forEach(([name,color])=>{const b=document.createElement('button');b.type='button';b.dataset.category=name;b.setAttribute('aria-pressed','false');b.innerHTML='<i style="background:'+color+'"></i><strong>'+esc(name)+'</strong><small>'+records.filter(r=>majorOf(r)===name).length+'项</small>';b.onclick=()=>{select.value=name;render()};document.querySelector('#resourceOverview').append(b)});
function render(){const q=document.querySelector('#resourceSearch').value.trim().toLowerCase();const matched=records.filter(r=>(!select.value||majorOf(r)===select.value)&&[r.id,r.name,r.area,r.category,r.educationTheme,r.summary].join(' ').toLowerCase().includes(q));document.querySelector('#resultCount').textContent='当前显示 '+matched.length+' 项资源';document.querySelectorAll('[data-category]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.category===select.value)));
function filled(v){return v!==null&&v!==undefined&&String(v).trim()!==''&&!/^(?:未填写|记录未填写|未提供|暂无|无数据|不详|未知|待补充|未记录|[-—/]|N\/A|null|undefined)$/i.test(String(v).trim())}
function activityHtml(group,r){let offset=0;for(const g of window.jinyunActivityGroups(r)){if(g.text.trim()===String(group).trim())break;offset+=g.items.length;}return window.jinyunSplitActivities(group).map((text,i)=>'<a class="activity-link" href="courses.html?resource='+encodeURIComponent(r.id)+'#activity-'+encodeURIComponent(r.id)+'-'+(offset+i)+'">'+esc(text)+' ↗</a>').join('；');}
document.querySelector('#resourceList').innerHTML=matched.map(r=>{const fields=[['记录编号',r.id],['类别',r.category],['区域',r.area],['教育主题',r.educationTheme],['适用人群',r.audience],['推荐季节',r.season],['教育价值',r.educationValue],['安全提示',r.safety],['调查日期',r.surveyDate],...window.jinyunActivityGroups(r).map(g=>[g.label,g.text]),...Object.entries(r.details||{}).filter(([k,v])=>!/建议活动|活动内容与流程/.test(k)&&![r.educationTheme,r.audience,r.season,r.educationValue,r.safety].some(x=>filled(x)&&x===v))].filter(([k,v])=>filled(v));return '<article class="resource-item" id="resource-'+esc(r.id)+'"><h2>'+esc(r.name)+'</h2>'+(filled(r.summary)?'<p>'+esc(r.summary)+'</p>':'')+(filled(r.educationTheme)?'<p>教育主题：'+esc(r.educationTheme)+'</p>':'')+'<details><summary>查看完整记录与教育主题</summary><dl>'+fields.map(([k,v])=>'<dt>'+esc(k)+'</dt><dd>'+(/建议活动|活动内容与流程/.test(k)?activityHtml(v,r):esc(v))+'</dd>').join('')+'</dl></details><a class="map-link" href="'+mapUrl(r)+'">在地图查看位置与图片 ↗</a></article>'}).join('')||'<p>没有符合筛选条件的资源。</p>'}
select.onchange=render;document.querySelector('#resourceSearch').oninput=render;document.querySelector('#filters').onsubmit=e=>e.preventDefault();document.querySelector('#filters').onreset=()=>setTimeout(render,0);render();const requested=new URLSearchParams(location.search).get('resource');if(requested){document.querySelector('#resourceSearch').value=requested;render();const el=document.getElementById('resource-'+requested);if(el){el.querySelector('details').open=true;requestAnimationFrame(()=>el.scrollIntoView({block:'start'}))}}
</script></body></html>
